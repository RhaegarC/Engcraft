<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Egnlish Craft</title>
  <meta name="description" content="Practice English personal and possessive pronouns: spelling and usage, for young EFL learners." />
  <meta name="theme-color" content="#ff9f43" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="504x504" href="icons/mc504.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/mc192.png" />
  <link rel="apple-touch-icon" href="icons/icons/mc504.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pronouns" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- New-version banner; shown by workbox-window when an updated SW is waiting. -->
  <div id="updateBanner" class="update-banner" hidden>
    <span>🆕 New version available — reload to update</span>
    <button id="updateReload" class="update-btn">Reload</button>
  </div>

  <!-- Home: 2x2 grid of four activities -->
  <main id="menu">
    <div class="logo">🎯</div>
    <h1>Egnlish Craft</h1>
    <p class="tagline">代词练习 · English pronouns</p>
    <div id="cards" class="grid"></div>
  </main>

  <!-- Activity screen -->
  <section id="activity" hidden>
    <header class="act-header">
      <button id="backBtn" class="icon-btn" aria-label="Back to menu">←</button>
      <div class="act-title">
        <h2 id="actTitle"></h2>
        <span id="actZh"></span>
      </div>
    </header>

    <div class="progress-wrap"><div id="progressFill" class="progress-fill"></div></div>
    <div id="progressText" class="progress-text"></div>

    <div id="voiceBanner" hidden></div>

    <div id="stage"></div>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="vendor/workbox-window.prod.umd.js"></script>
  <script>
    // PWA update notification: workbox-window detects a new version of sw.js and
    // reveals the banner; the user taps Reload, we message the waiting SW to
    // activate, then reload so the fresh app takes over.
    if ("serviceWorker" in navigator && window.workbox && window.workbox.Workbox) {
      const wb = new window.workbox.Workbox("sw.js");

      wb.addEventListener("waiting", () => {
        document.getElementById("updateBanner").hidden = false;
      });

      document.getElementById("updateReload").addEventListener("click", () => {
        wb.messageSkipWaiting();
      });

      // After skipWaiting() the new SW activates and claims the page; reload to
      // hand the user the updated app.
      wb.addEventListener("controlling", () => {
        window.location.reload();
      });

      window.addEventListener("load", () => {
        wb.register().catch(() => {});
      });
    } else if ("serviceWorker" in navigator) {
      // Vendor script didn't load: fall back to plain registration so the PWA
      // still goes offline-first (just without the update banner).
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
